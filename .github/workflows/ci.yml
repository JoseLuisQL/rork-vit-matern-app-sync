name: VitMaterna CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-typecheck:
    name: Test & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Test Cloudflare Functions Backend
        run: |
          cd functions
          bun test

      - name: Test & Typecheck Self-Hosted Server Backend
        run: |
          cd server
          bun install --frozen-lockfile || bun install
          bun run typecheck
          bun test

      - name: Test & Typecheck Expo Frontend App
        run: |
          cd expo
          bun install --frozen-lockfile || bun install
          bunx tsc --noEmit
          bun test
