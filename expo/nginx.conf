# VITMATERNA — Web + puerta de entrada única (mismo dominio, sin CORS).
# - Sirve la app web exportada (Expo) como SPA.
# - Pasa /api, /ping y /health al contenedor "api" del docker compose.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker: si el contenedor api cambia de IP al actualizar,
    # nginx lo re-resuelve solo (sin necesidad de reiniciar la web).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    # Las fotos de perfil viajan en JSON: margen holgado para subidas.
    client_max_body_size 25m;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }

    location = /ping { proxy_pass $api_upstream; }
    location = /health { proxy_pass $api_upstream; }

    # Archivos generados con huella única: caché larga e inmutable.
    location /_expo/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Rutas de la app (expo-router): siempre index.html (SPA).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
}
