# VITMATERNA — Despliegue autoalojado: WEB + API + PostgreSQL 17 en un solo compose.
# 1) Copia .env.example a .env y define POSTGRES_PASSWORD.
# 2) docker compose up -d --build
# 3) Todo queda en http://TU_SERVIDOR:8080 — la página web en "/" y la API en
#    "/api" (el APK usa esta MISMA dirección). Ponle HTTPS con Caddy o Nginx.
name: vitmaterna

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vitmaterna}
      POSTGRES_USER: ${POSTGRES_USER:-vitmaterna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vitmaterna} -d ${POSTGRES_DB:-vitmaterna}"]
      interval: 5s
      timeout: 5s
      retries: 12
    # Descomenta SOLO si necesitas entrar a la base desde fuera del servidor:
    # ports:
    #   - "5432:5432"

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vitmaterna}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vitmaterna}
      PORT: 8080
      # demo = cuentas y casos de prueba · produccion = plataforma limpia con solo admin
      SEED_MODE: ${SEED_MODE:-demo}
      ADMIN_DNI: ${ADMIN_DNI:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME:-}
      ADMIN_LAST_NAME: ${ADMIN_LAST_NAME:-}
    # La API no se publica directamente: todo entra por el servicio "web"
    # (nginx), que sirve la página y le pasa /api, /ping y /health.
    # Si además quieres exponerla en su propio puerto, descomenta:
    # ports:
    #   - "${API_PORT:-8081}:8080"

  # Versión web de la app (la misma app, en el navegador) + puerta de entrada
  # única: nginx sirve la web y pasa /api, /ping y /health al contenedor api.
  web:
    build:
      context: ../expo
      dockerfile: Dockerfile.web
      args:
        # Vacío = la web se conecta a su MISMO dominio (recomendado). Defínela
        # solo si la web vivirá en un dominio distinto al de la API.
        EXPO_PUBLIC_API_URL: ${WEB_API_URL:-}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  pgdata:
